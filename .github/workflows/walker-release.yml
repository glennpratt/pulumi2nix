# Builds the walker as a static musl binary via Nix (pkgsStatic — no
# rustup/apt toolchains), attests its provenance, and publishes a release
# tagged walker-<commit sha>. Index repos pin the reusable index-walk.yml
# workflow to such a sha; it downloads this asset and verifies the
# attestation before executing it.
#
# x86_64-linux only: the walker runs solely on the index repo's GHA runners.
# (The hashes it computes cover all four *target* platforms regardless of
# where it executes; local ARM/darwin use goes through
# `nix run .#pulumi2nix-index`.)
name: walker-release

on:
  push:
    branches: [main]
    paths:
      - "walker/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/walker-release.yml"
      - ".github/workflows/index-walk.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Build static walker (tests run in checkPhase)
        run: nix build .#pulumi2nix-index-static
      - name: Pack deterministic tarball (preserves the executable bit)
        # Every source of nondeterminism pinned (mtime, owner, ordering,
        # gzip timestamp), so anyone can rebuild this commit and compare
        # sha256 — reproducibility on top of the attestation.
        run: |
          install -m 0755 result/bin/pulumi2nix-index pulumi2nix-index
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime='1970-01-01 00:00:00 UTC' \
              -cf - pulumi2nix-index | gzip -n \
              > pulumi2nix-index-x86_64-linux.tar.gz
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: pulumi2nix-index-x86_64-linux.tar.gz
      - name: Publish release named after the commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "walker-${GITHUB_SHA}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "walker @ ${GITHUB_SHA:0:12}" \
            --notes "Attested static walker binary built from ${GITHUB_SHA} via nix build .#pulumi2nix-index-static, packed deterministically. Verify with: gh attestation verify <file> --repo ${GITHUB_REPOSITORY}" \
            pulumi2nix-index-x86_64-linux.tar.gz
