# Reusable workflow for pulumi-nix-index repos. The caller pins this file by
# SHA (`uses: glennpratt/pulumi2nix/.github/workflows/index-walk.yml@<sha>`);
# github.job_workflow_sha resolves to that same pin, and the job downloads
# the walker release built from exactly that commit (tag walker-<sha>),
# verifying its build provenance attestation before executing it. One pin
# governs the workflow logic AND the walker binary. Pin only SHAs that have
# a walker release (cut automatically by walker-release.yml on main).
name: index-walk

on:
  workflow_call:
    inputs:
      provider:
        description: "Demand lane: index this provider now (name or name@version)"
        type: string
        default: ""
      max-artifacts:
        description: "Backfill budget: tarballs to hash this run"
        type: number
        default: 800
      max-seconds:
        description: "Backfill budget: wall-clock seconds"
        type: number
        default: 3600
      verify-sample:
        description: "Existing entries to re-verify against drift"
        type: number
        default: 50

jobs:
  walk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4 # the caller's index repo

      - name: Fetch and verify the attested walker (pinned by workflow SHA)
        env:
          GH_TOKEN: ${{ github.token }}
          WALKER_REPO: glennpratt/pulumi2nix
          PIN: ${{ github.job_workflow_sha }}
        run: |
          gh release download "walker-${PIN}" --repo "$WALKER_REPO" \
            --pattern "pulumi2nix-index-x86_64-linux" \
            --output pulumi2nix-index || {
              echo "::error::no walker release for ${PIN} — pin index-walk.yml to a sha that has one (see ${WALKER_REPO} releases)"; exit 1; }
          gh attestation verify pulumi2nix-index --repo "$WALKER_REPO" \
            --format json > attestation.json
          # Belt and braces: the attested provenance must reference the
          # pinned commit itself, not merely any commit of the repo.
          jq -e --arg sha "$PIN" 'tostring | contains($sha)' attestation.json > /dev/null || {
            echo "::error::attestation does not reference pinned sha ${PIN}"; exit 1; }
          chmod +x pulumi2nix-index
          rm attestation.json

      - name: Walk (breadth-first backfill within budget)
        run: |
          ARGS=(walk --index-dir . --providers-file providers.txt
                --max-artifacts "${{ inputs.max-artifacts }}"
                --max-seconds "${{ inputs.max-seconds }}")
          if [ -n "${{ inputs.provider }}" ]; then
            ARGS+=(--provider "${{ inputs.provider }}")
          fi
          ./pulumi2nix-index "${ARGS[@]}"

      - name: Verify (re-witness a random sample of existing entries)
        id: verify
        continue-on-error: true
        run: |
          ./pulumi2nix-index verify --index-dir . \
            --sample "${{ inputs.verify-sample }}"

      - name: Commit new entries (and any conflict reports)
        run: |
          git config user.name "pulumi-nix-index bot"
          git config user.email "actions@github.com"
          mkdir -p index conflicts
          git add index conflicts
          git diff --cached --quiet && exit 0
          git commit -m "walk: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

      - name: Raise the alarm on drift
        if: steps.verify.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "DRIFT: released artifact no longer matches its recorded hash" \
            --body "verify failed in ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} — see conflicts/ in the latest commit. Existing index entries were NOT modified." \
            || true
          exit 1
