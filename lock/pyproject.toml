[project]
name = "pulumi2nix-lock"
version = "0.1.0"
description = "Generate pulumi-lock.json (Nix SRI hashes for Pulumi provider plugins) from uv.lock"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Glenn Pratt", email = "glennpratt@gmail.com" }]
dependencies = []

[project.scripts]
pulumi2nix-lock = "pulumi2nix_lock:main"
pulumi2nix-index = "pulumi2nix_lock.index:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pulumi2nix_lock"]
