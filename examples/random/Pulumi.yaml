name: pulumi2nix-example-random
description: pulumi2nix end-to-end example using pulumi-random
# toolchain: pip (not uv) — under pulumi2nix the environment is fully
# materialized by Nix and exposed via PULUMI_PYTHON_CMD; the pip toolchain
# honors that env var, while auto-detection would pick uv (uv.lock present)
# and require the uv binary at runtime.
runtime:
  name: python
  options:
    toolchain: pip
