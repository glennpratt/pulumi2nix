# All walk/verify/commit/alarm logic lives in pulumi2nix's reusable workflow;
# this repo stays data-only. The @SHA pin governs both the workflow steps AND
# the walker code (github.job_workflow_sha) — bump it only via reviewed PRs.
name: walk

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      provider:
        description: "Demand lane: index this provider now (name or name@version)"
        required: false

# Single writer: cron and demand runs queue behind each other.
concurrency:
  group: index-writer
  cancel-in-progress: false

jobs:
  walk:
    uses: glennpratt/pulumi2nix/.github/workflows/index-walk.yml@REPLACE_WITH_PINNED_SHA
    permissions:
      contents: write
      issues: write
    with:
      provider: ${{ inputs.provider || '' }}
